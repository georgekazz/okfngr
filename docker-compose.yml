version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: okfn-app
    restart: always
    ports:
      - "${APP_PORT:-8059}:80"
    environment:
      APP_NAME: "OKFN Greece"
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: ${APP_URL:-http://localhost:8059}
      APP_KEY: ${APP_KEY}
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-okfngr}
      DB_USERNAME: ${DB_USERNAME:-okfnuser}
      DB_PASSWORD: ${DB_PASSWORD:-okfnpass}
    volumes:
      - storage_data:/var/www/html/storage/app/public
    depends_on:
      db:
        condition: service_healthy
    networks:
      - okfn_network

  db:
    image: mysql:8.0
    container_name: okfn-db
    restart: always
    command: >
      --wait_timeout=28800
      --interactive_timeout=28800
      --net_read_timeout=60
      --net_write_timeout=60
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-okfngr}
      MYSQL_USER: ${DB_USERNAME:-okfnuser}
      MYSQL_PASSWORD: ${DB_PASSWORD:-okfnpass}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-okfnroot}
    ports:
      - "${DB_PORT:-3339}:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 60s
    networks:
      - okfn_network

volumes:
  db_data:
  storage_data:

networks:
  okfn_network:
    driver: bridge